name: Fetch Government Policy Trends

on:
  schedule:
    # 00:00 KST == 15:00 UTC (전날), 12:00 KST == 03:00 UTC
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest ministry press releases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-gov-trends.mjs

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- data/trends.json; then
            echo "No changes to data/trends.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trends.json
          git commit -m "chore: update government policy trends ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
