name: Fetch Government Policy Trends

on:
  schedule:
    # 00:00 KST == 15:00 UTC (전날), 12:00 KST == 03:00 UTC
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest ministry press releases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-gov-trends.mjs

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- data/trends.json; then
            echo "No changes to data/trends.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trends.json
          git commit -m "chore: update government policy trends ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # 경쟁대학 동향 워크플로우가 같은 시각(정오·자정)에 함께 실행되어 서로 다른 파일을
          # 각자 커밋·푸시하므로, 둘 다 push하는 순간이 겹치면 뒤에 push하는 쪽이 거절된다.
          # rebase 후 재시도해 두 워크플로우가 안전하게 공존하도록 한다.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i) — rebasing onto latest origin/main and retrying"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "::error::여러 번 재시도했지만 push에 실패했습니다."
          exit 1
