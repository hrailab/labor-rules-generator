name: Debug Fetch Korea.kr
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and inspect page structure
        run: node scripts/debug-korea-kr.mjs
