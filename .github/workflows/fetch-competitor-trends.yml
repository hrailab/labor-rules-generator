name: Fetch Competitor University Trends

on:
  schedule:
    # 00:00 KST == 15:00 UTC (전날), 12:00 KST == 03:00 UTC
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest competitor university notices
        run: node scripts/fetch-competitor-trends.mjs

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- data/competitors.json; then
            echo "No changes to data/competitors.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/competitors.json
          git commit -m "chore: update competitor university trends ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
